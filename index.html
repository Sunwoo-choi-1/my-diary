<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>다이어리</title>
  <script>
    /* 화면이 그려지기 전에 테마를 먼저 적용 → 새로고침 때 흰 화면이 번쩍이지 않음 */
    (function () {
      try {
        const saved = localStorage.getItem('today-theme');
        const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.dataset.theme = 'dark';
      } catch (error) { /* 저장소를 못 쓰는 환경이면 기본(밝은) 테마로 둠 */ }
    })();
  </script>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #19202d;
      --muted: #8991a3;
      --line: #e9ebf2;
      --primary: #6757e8;
      --primary-dark: #5546d0;
      --soft-primary: #eeecff;
      --danger: #e36a76;
      --shadow: 0 18px 50px rgba(46, 43, 86, .10);
    }

    * { box-sizing: border-box; }

    /* ── 다크 모드 팔레트: <html data-theme="dark"> 일 때만 적용 ── */
    :root[data-theme="dark"] {
      --bg: #0f1117;
      --card: #171a23;
      --text: #e9ebf4;
      --muted: #868d9f;
      --line: #272b38;
      --primary: #8b7cff;
      --primary-dark: #9c8fff;
      --soft-primary: #251f47;
      --danger: #ef8390;
      --shadow: 0 18px 50px rgba(0, 0, 0, .5);
    }
    :root[data-theme="dark"] body { background: radial-gradient(circle at 50% -15%, #241f4d 0, transparent 38%), var(--bg); }
    :root[data-theme="dark"] .card { border-color: #262a36; }
    :root[data-theme="dark"] #todo-input { background: #101320; }
    :root[data-theme="dark"] #todo-input::placeholder { color: #6d7386; }
    :root[data-theme="dark"] #note-text { background: #101320; }
    :root[data-theme="dark"] #note-text::placeholder { color: #6d7386; }
    :root[data-theme="dark"] .check { border-color: #3a4052; }
    :root[data-theme="dark"] .todo-item.done .todo-text { color: #6d7386; }
    :root[data-theme="dark"] .delete-btn { color: #5d6376; }
    :root[data-theme="dark"] .footer { color: #6a7082; }
    :root[data-theme="dark"] .theme-toggle { box-shadow: 0 6px 18px rgba(0, 0, 0, .4); }

    /* ── 우측 상단 테마 전환 버튼 ── */
    .theme-toggle {
      position: fixed; top: 18px; right: 18px; z-index: 10;
      display: grid; place-items: center;
      width: 44px; height: 44px; padding: 0;
      border: 1px solid var(--line); border-radius: 50%;
      background: var(--card); color: var(--text);
      font-size: 1.12rem; line-height: 1;
      box-shadow: 0 6px 18px rgba(46, 43, 86, .12);
      transition: transform .2s, background-color .25s, border-color .25s;
    }
    .theme-toggle:hover { transform: translateY(-2px) rotate(-10deg); }
    .theme-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% -15%, #ebe8ff 0, transparent 38%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .app { width: min(100% - 32px, 620px); margin: 0 auto; padding: 72px 0 48px; }
    .hero { margin-bottom: 26px; }
    .eyebrow { color: var(--primary); font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; margin: 0 0 12px; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.15rem); letter-spacing: -.06em; line-height: 1.1; }
    .date { margin: 12px 0 0; color: var(--muted); font-size: .94rem; }

    .card { background: var(--card); border: 1px solid rgba(224, 226, 237, .8); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }

    /* ── 먼슬리 달력 ── */
    .cal-card { margin-bottom: 18px; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .cal-nav { display: flex; align-items: center; gap: 6px; }
    .cal-title { font-size: 1rem; letter-spacing: -.02em; min-width: 108px; text-align: center; }
    .nav-btn { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--muted); font-size: 1rem; line-height: 1; transition: color .2s, border-color .2s; }
    .nav-btn:hover { color: var(--text); border-color: var(--primary); }
    .today-btn { border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; background: transparent; color: var(--muted); font-size: .82rem; transition: color .2s, border-color .2s; }
    .today-btn:hover { color: var(--primary); border-color: var(--primary); }
    /* minmax(0, 1fr): 점 줄의 min-content가 칸 폭을 밀어내 7칸이 카드를 넘치는 걸 막는다 */
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 12px; }
    .cal-dow { text-align: center; font-size: .75rem; color: var(--muted); padding: 6px 0 8px; }
    .cal-dow.sun { color: var(--danger); }
    .cal-dow.sat { color: var(--primary); }
    /* 오늘은 '숫자 색', 선택한 날은 '배경+테두리' — 서로 다른 방식이라 겹쳐도 구분됨 */
    .cal-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; aspect-ratio: 1 / 1; padding: 0; overflow: hidden; border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--text); transition: background-color .15s, border-color .15s; }
    .cal-cell:hover { background: var(--soft-primary); }
    .cal-cell:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .cal-cell.today .cal-num { color: var(--primary); font-weight: 800; }
    .cal-cell.selected { background: var(--soft-primary); border-color: var(--primary); }
    .cal-cell.other .cal-num { color: var(--muted); opacity: .5; }
    .cal-num { font-size: .92rem; line-height: 1; }
    .cal-marks { display: flex; align-items: center; justify-content: center; gap: 3px; height: 8px; max-width: 100%; }
    /* 미완료는 꽉 찬 점, 완료는 빈 원 — 색이 아니라 모양으로 구분 */
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
    .dot.done { background: transparent; border: 1px solid var(--muted); }
    .more { font-size: .6rem; line-height: 1; color: var(--muted); }
    .note-mark { font-size: .62rem; line-height: 1; color: var(--muted); }

    /* ── 그날 상세 ── */
    .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; }
    .day-title { margin: 0; font-size: 1.05rem; letter-spacing: -.03em; }
    .day-meta { display: flex; align-items: center; gap: 10px; }
    .day-count { color: var(--muted); font-size: .85rem; white-space: nowrap; }
    .day-count strong { color: var(--text); }
    .clear-btn { border: 0; color: var(--muted); background: transparent; font-size: .82rem; padding: 5px; }
    .clear-btn:hover { color: var(--danger); }

    .input-wrap { display: flex; gap: 10px; padding: 0 16px 4px; }
    #todo-input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--text); background: #f7f7fb; border-radius: 13px; padding: 14px 15px; }
    #todo-input::placeholder { color: #aab0bf; }
    .add-btn { border: 0; border-radius: 13px; padding: 0 19px; color: #fff; font-weight: 800; background: var(--primary); transition: background .2s, transform .2s; }
    .add-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .empty { color: var(--muted); text-align: center; padding: 26px 20px 30px; font-size: .95rem; }
    .empty-icon { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 13px; border-radius: 50%; background: var(--soft-primary); color: var(--primary); font-size: 1.4rem; }
    .todo-list { list-style: none; margin: 0; padding: 0 12px 4px; }
    .todo-item { display: flex; align-items: center; gap: 13px; padding: 14px 10px; border-top: 1px solid var(--line); animation: appear .22s ease-out; }
    .check { appearance: none; flex: 0 0 auto; width: 21px; height: 21px; margin: 0; border: 2px solid #d4d7e3; border-radius: 7px; position: relative; transition: .2s; }
    .check:checked { border-color: var(--primary); background: var(--primary); }
    .check:checked::after { content: ""; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .todo-text { flex: 1; min-width: 0; font-size: .98rem; line-height: 1.45; overflow-wrap: anywhere; }
    .todo-item.done .todo-text { color: #adb2bf; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .delete-btn { opacity: 0; border: 0; color: #c7cad4; background: transparent; font-size: 1.2rem; line-height: 1; padding: 6px; transition: opacity .2s, color .2s; }
    .todo-item:hover .delete-btn, .delete-btn:focus-visible { opacity: 1; }
    .delete-btn:hover { color: var(--danger); }

    /* ── 그날 있었던 일 (기록) ── */
    .note-wrap { padding: 16px 20px 20px; margin-top: 12px; border-top: 1px solid var(--line); }
    .note-title { margin: 0 0 10px; font-size: .88rem; font-weight: 800; color: var(--muted); }
    #note-text { display: block; width: 100%; min-height: 110px; resize: vertical; border: 0; outline: 0; color: var(--text); background: #f7f7fb; border-radius: 13px; padding: 13px 14px; font: inherit; line-height: 1.55; }
    #note-text::placeholder { color: #aab0bf; }
    .note-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 10px; }
    .note-status { color: var(--primary); font-size: .8rem; opacity: 0; transition: opacity .35s; }
    .note-status.show { opacity: 1; }
    .note-status.error { color: var(--danger); }
    .note-save { padding: 10px 18px; }

    .footer { margin: 18px 0 0; color: #a9aebb; text-align: center; font-size: .76rem; }
    .about-link { color: inherit; text-underline-offset: 3px; transition: color .2s; }
    .about-link:hover { color: var(--primary); }
    @keyframes appear { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) { .app { padding-top: 42px; } .cal-head { padding: 12px; } .cal-title { min-width: 92px; font-size: .94rem; } .today-btn { padding: 6px 10px; } .cal-grid { gap: 2px; padding: 8px; } .cal-num { font-size: .85rem; } .cal-marks { gap: 2px; } .dot { width: 5px; height: 5px; } .more, .note-mark { font-size: .55rem; } .day-head { padding: 14px 14px 10px; } .input-wrap { padding: 0 12px 4px; } .add-btn { padding: 0 15px; } .note-wrap { padding: 14px; } .delete-btn { opacity: 1; } }
    @media (max-width: 520px) { .theme-toggle { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 1rem; } }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="어두운 모드로 전환" aria-pressed="false">🌙</button>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Daily diary</p>
      <h1>다이어리</h1>
      <p class="date" id="today"></p>
    </header>

    <section class="card cal-card" aria-label="달력">
      <div class="cal-head">
        <div class="cal-nav">
          <button class="nav-btn" id="prev-month" type="button" aria-label="이전 달">‹</button>
          <strong class="cal-title" id="cal-title"></strong>
          <button class="nav-btn" id="next-month" type="button" aria-label="다음 달">›</button>
        </div>
        <button class="today-btn" id="go-today" type="button">오늘</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <section class="card day-card" aria-labelledby="day-title">
      <div class="day-head">
        <h2 class="day-title" id="day-title"></h2>
        <div class="day-meta">
          <span class="day-count" id="day-count"></span>
          <button class="clear-btn" id="clear-completed" type="button">완료한 일 지우기</button>
        </div>
      </div>
      <form class="input-wrap" id="todo-form">
        <input id="todo-input" type="text" maxlength="120" autocomplete="off" placeholder="이 날의 할 일을 입력하세요" aria-label="이 날의 할 일" />
        <button class="add-btn" type="submit">추가</button>
      </form>
      <div class="empty" id="empty-state">
        <div class="empty-icon">✓</div>
        <div>이 날은 아직 비어 있어요.<br />할 일을 적거나 아래에 기록을 남겨 보세요.</div>
      </div>
      <ul class="todo-list" id="todo-list"></ul>
      <div class="note-wrap">
        <h3 class="note-title">그날 있었던 일</h3>
        <textarea id="note-text" rows="4" maxlength="2000" placeholder="그날 있었던 일을 자유롭게 적어 보세요" aria-label="그날 있었던 일 기록"></textarea>
        <div class="note-actions">
          <span class="note-status" id="note-status" role="status"></span>
          <button class="add-btn note-save" id="note-save" type="button">저장</button>
        </div>
      </div>
    </section>
    <p class="footer">이 기기에 저장됩니다. 기록은 저장 버튼을 눌러 주세요. · <a class="about-link" href="about.html">소개</a></p>
  </main>

  <script>
    const STORAGE_KEY = 'today-todos-v2';
    const LEGACY_KEY = 'today-todos-v1';
    const NOTE_KEY = 'today-notes-v1';
    const THEME_KEY = 'today-theme';
    const themeToggle = document.querySelector('#theme-toggle');

    function currentTheme() { return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light'; }

    function applyTheme(theme) {
      const dark = theme === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      themeToggle.textContent = dark ? '☀️' : '🌙';
      themeToggle.setAttribute('aria-pressed', String(dark));
      themeToggle.setAttribute('aria-label', dark ? '밝은 모드로 전환' : '어두운 모드로 전환');
    }

    themeToggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (error) { /* 저장만 실패, 화면 전환은 그대로 동작 */ }
    });

    applyTheme(currentTheme()); // head에서 이미 정해진 테마를 버튼 모양에 반영

    const calTitle = document.querySelector('#cal-title');
    const calGrid = document.querySelector('#cal-grid');
    const prevMonth = document.querySelector('#prev-month');
    const nextMonth = document.querySelector('#next-month');
    const goToday = document.querySelector('#go-today');
    const dayTitle = document.querySelector('#day-title');
    const dayCount = document.querySelector('#day-count');
    const clearCompleted = document.querySelector('#clear-completed');
    const form = document.querySelector('#todo-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');
    const emptyState = document.querySelector('#empty-state');
    const noteText = document.querySelector('#note-text');
    const noteSave = document.querySelector('#note-save');
    const noteStatus = document.querySelector('#note-status');

    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const fullDayFormat = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
    const shortDayFormat = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

    let migrated = false;
    let todos = loadTodos();
    let notes = loadNotes();
    let selectedDate = todayString();
    let viewMonth = firstOfMonth(selectedDate);
    let noteStatusTimer = 0;

    /* ── 저장소 ── */
    function readJson(key) {
      try { return JSON.parse(localStorage.getItem(key)); } catch (error) { return null; }
    }

    function writeJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (error) { return false; }
    }

    function isTodo(todo) { return todo && typeof todo.text === 'string'; }
    function isDateKey(value) { return typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value); }

    function normalizeTodo(todo, date) {
      return { id: todo.id ?? Date.now() + Math.random(), date: isDateKey(date) ? date : todayString(), text: todo.text, done: Boolean(todo.done) };
    }

    // v2가 없으면 예전 구조(v1)의 마감일을 소속 날짜로 옮겨 온다. v1 키는 되돌릴 수 있게 남겨 둔다
    function loadTodos() {
      const saved = readJson(STORAGE_KEY);
      if (Array.isArray(saved)) return saved.filter(isTodo).map(todo => normalizeTodo(todo, todo.date));
      const legacy = readJson(LEGACY_KEY);
      if (!Array.isArray(legacy)) return [];
      migrated = true;
      return legacy.filter(isTodo).map(todo => normalizeTodo(todo, todo.due));
    }

    function loadNotes() {
      const saved = readJson(NOTE_KEY);
      return saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
    }

    function saveTodos() { return writeJson(STORAGE_KEY, todos); }
    function saveNotes() { return writeJson(NOTE_KEY, notes); }

    /* ── 날짜 (전부 로컬 기준. new Date('2026-09-23')은 UTC로 읽혀 하루 밀리므로 쓰지 않음) ── */
    function dateKey(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }
    function todayString() { return dateKey(new Date()); }
    function parseKey(key) { const [year, month, day] = key.split('-').map(Number); return new Date(year, month - 1, day); }
    function shiftKey(key, days) { const date = parseKey(key); date.setDate(date.getDate() + days); return dateKey(date); }
    function firstOfMonth(key) { const date = parseKey(key); return new Date(date.getFullYear(), date.getMonth(), 1); }
    function sameMonth(date, month) { return date.getFullYear() === month.getFullYear() && date.getMonth() === month.getMonth(); }

    function todosOf(date) { return todos.filter(todo => todo.date === date); }

    /* ── 달력 ── */
    function renderCalendar() {
      calTitle.textContent = `${viewMonth.getFullYear()}년 ${viewMonth.getMonth() + 1}월`;
      calGrid.replaceChildren();

      WEEKDAYS.forEach((name, index) => {
        const head = document.createElement('div');
        head.className = `cal-dow${index === 0 ? ' sun' : index === 6 ? ' sat' : ''}`;
        head.textContent = name;
        calGrid.append(head);
      });

      const start = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1 - viewMonth.getDay());
      const today = todayString();
      for (let offset = 0; offset < 42; offset += 1) {
        const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + offset);
        calGrid.append(createCell(date, today));
      }
    }

    function createCell(date, today) {
      const key = dateKey(date);
      const dayTodos = todosOf(key);
      const left = dayTodos.filter(todo => !todo.done).length;
      const hasNote = Boolean(notes[key]);
      const selected = key === selectedDate;

      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-cell';
      if (!sameMonth(date, viewMonth)) cell.classList.add('other');
      if (key === today) { cell.classList.add('today'); cell.setAttribute('aria-current', 'date'); }
      if (selected) cell.classList.add('selected');
      cell.setAttribute('aria-pressed', String(selected));
      cell.tabIndex = selected ? 0 : -1;
      cell.innerHTML = '<span class="cal-num"></span><span class="cal-marks"></span>';
      cell.querySelector('.cal-num').textContent = date.getDate();

      const marks = cell.querySelector('.cal-marks');
      dayTodos.slice(0, 3).forEach(todo => {
        const dot = document.createElement('span');
        dot.className = `dot${todo.done ? ' done' : ''}`;
        marks.append(dot);
      });
      if (dayTodos.length > 3) {
        const more = document.createElement('span');
        more.className = 'more';
        more.textContent = `+${dayTodos.length - 3}`;
        marks.append(more);
      }
      if (hasNote) {
        const mark = document.createElement('span');
        mark.className = 'note-mark';
        mark.textContent = '✎';
        marks.append(mark);
      }

      const label = [shortDayFormat.format(date)];
      if (dayTodos.length) label.push(`할 일 ${dayTodos.length}개 중 ${left}개 남음`);
      if (hasNote) label.push('기록 있음');
      cell.setAttribute('aria-label', label.join(', '));

      cell.addEventListener('click', () => selectDate(key));
      return cell;
    }

    /* ── 그날 상세 ── */
    function renderDay() {
      const dayTodos = todosOf(selectedDate);
      const left = dayTodos.filter(todo => !todo.done).length;

      dayTitle.textContent = fullDayFormat.format(parseKey(selectedDate));
      dayCount.innerHTML = dayTodos.length ? `<strong>${left}</strong>개 남음` : '';
      clearCompleted.hidden = !dayTodos.some(todo => todo.done);
      emptyState.hidden = dayTodos.length > 0;

      list.replaceChildren();
      dayTodos.forEach(todo => {
        const item = document.createElement('li');
        item.className = `todo-item${todo.done ? ' done' : ''}`;
        item.innerHTML = `
          <input class="check" type="checkbox" ${todo.done ? 'checked' : ''} aria-label="${escapeHtml(todo.text)} 완료 여부" />
          <span class="todo-text"></span>
          <button class="delete-btn" type="button" aria-label="할 일 삭제">×</button>`;
        item.querySelector('.todo-text').textContent = todo.text;
        item.querySelector('.check').addEventListener('change', event => {
          todo.done = event.target.checked;
          saveTodos(); renderAll();
        });
        item.querySelector('.delete-btn').addEventListener('click', () => {
          todos = todos.filter(current => current.id !== todo.id);
          saveTodos(); renderAll();
        });
        list.append(item);
      });

      noteText.value = notes[selectedDate] || '';
    }

    function renderAll() { renderCalendar(); renderDay(); }

    function escapeHtml(value) { return value.replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char])); }

    /* ── 기록 ── */
    // 입력칸 내용을 그 날짜에 보관 (빈 기록은 키째 지움). 바뀐 게 없으면 null
    function storeNote(date) {
      const text = noteText.value.trim();
      if (text === (notes[date] || '')) return null;
      if (text) notes[date] = text; else delete notes[date];
      return saveNotes();
    }

    function flashNote(message, failed) {
      noteStatus.textContent = message;
      noteStatus.classList.toggle('error', Boolean(failed));
      noteStatus.classList.add('show');
      clearTimeout(noteStatusTimer);
      noteStatusTimer = setTimeout(() => noteStatus.classList.remove('show'), 1800);
    }

    /* ── 날짜 이동 ── */
    // 날짜를 옮기기 전에 쓰던 기록을 먼저 보관한다 (달력을 누르다 글이 날아가는 걸 막는 안전망)
    function selectDate(key, focusCell) {
      const carried = storeNote(selectedDate);
      selectedDate = key;
      if (!sameMonth(parseKey(key), viewMonth)) viewMonth = firstOfMonth(key);
      renderAll();
      if (carried !== null) flashNote(carried ? '앞 날짜 기록을 저장했어요' : '저장하지 못했어요', !carried);
      if (focusCell) {
        const cell = calGrid.querySelector('.cal-cell.selected');
        if (cell) cell.focus();
      }
    }

    function moveMonth(step) {
      const next = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + step, 1);
      const today = todayString();
      // 옮겨 간 달에 오늘이 있으면 오늘을, 없으면 1일을 고른다
      selectDate(sameMonth(parseKey(today), next) ? today : dateKey(next));
    }

    prevMonth.addEventListener('click', () => moveMonth(-1));
    nextMonth.addEventListener('click', () => moveMonth(1));
    goToday.addEventListener('click', () => selectDate(todayString()));

    calGrid.addEventListener('keydown', event => {
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[event.key];
      if (!step) return;
      event.preventDefault();
      selectDate(shiftKey(selectedDate, step), true);
    });

    /* ── 할 일 ── */
    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      todos.unshift({ id: Date.now() + Math.random(), date: selectedDate, text, done: false });
      saveTodos(); renderAll(); input.value = ''; input.focus();
    });

    clearCompleted.addEventListener('click', () => {
      todos = todos.filter(todo => !(todo.date === selectedDate && todo.done));
      saveTodos(); renderAll();
    });

    noteSave.addEventListener('click', () => {
      const saved = storeNote(selectedDate);
      if (saved === false) { flashNote('저장하지 못했어요', true); return; }
      renderCalendar(); // ✎ 표시 갱신
      flashNote('저장됨');
    });

    if (migrated) saveTodos();
    document.querySelector('#today').textContent = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());
    renderAll();
  </script>
</body>
</html>
