<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 할 일</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #19202d;
      --muted: #8991a3;
      --line: #e9ebf2;
      --primary: #6757e8;
      --primary-dark: #5546d0;
      --soft-primary: #eeecff;
      --danger: #e36a76;
      --shadow: 0 18px 50px rgba(46, 43, 86, .10);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% -15%, #ebe8ff 0, transparent 38%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .app { width: min(100% - 32px, 620px); margin: 0 auto; padding: 72px 0 48px; }
    .hero { margin-bottom: 26px; }
    .eyebrow { color: var(--primary); font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; margin: 0 0 12px; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.15rem); letter-spacing: -.06em; line-height: 1.1; }
    .date { margin: 12px 0 0; color: var(--muted); font-size: .94rem; }

    .card { background: var(--card); border: 1px solid rgba(224, 226, 237, .8); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
    .input-wrap { display: flex; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
    #todo-input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--text); background: #f7f7fb; border-radius: 13px; padding: 14px 15px; }
    #todo-input::placeholder { color: #aab0bf; }
    .add-btn { border: 0; border-radius: 13px; padding: 0 19px; color: #fff; font-weight: 800; background: var(--primary); transition: background .2s, transform .2s; }
    .add-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 10px; }
    .count { color: var(--muted); font-size: .9rem; }
    .count strong { color: var(--text); }
    .clear-btn { border: 0; color: var(--muted); background: transparent; font-size: .82rem; padding: 5px; }
    .clear-btn:hover { color: var(--danger); }
    .empty { color: var(--muted); text-align: center; padding: 44px 20px 50px; font-size: .95rem; }
    .empty-icon { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 13px; border-radius: 50%; background: var(--soft-primary); color: var(--primary); font-size: 1.4rem; }
    .todo-list { list-style: none; margin: 0; padding: 0 12px 12px; }
    .todo-item { display: flex; align-items: center; gap: 13px; padding: 14px 10px; border-top: 1px solid var(--line); animation: appear .22s ease-out; }
    .check { appearance: none; flex: 0 0 auto; width: 21px; height: 21px; margin: 0; border: 2px solid #d4d7e3; border-radius: 7px; position: relative; transition: .2s; }
    .check:checked { border-color: var(--primary); background: var(--primary); }
    .check:checked::after { content: ""; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .todo-text { flex: 1; min-width: 0; font-size: .98rem; line-height: 1.45; overflow-wrap: anywhere; }
    .todo-item.done .todo-text { color: #adb2bf; text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .delete-btn { opacity: 0; border: 0; color: #c7cad4; background: transparent; font-size: 1.2rem; line-height: 1; padding: 6px; transition: opacity .2s, color .2s; }
    .todo-item:hover .delete-btn, .delete-btn:focus-visible { opacity: 1; }
    .delete-btn:hover { color: var(--danger); }
    .footer { margin: 18px 0 0; color: #a9aebb; text-align: center; font-size: .76rem; }
    @keyframes appear { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 520px) { .app { padding-top: 42px; } .input-wrap { padding: 12px; } .add-btn { padding: 0 15px; } .toolbar { padding-inline: 16px; } .delete-btn { opacity: 1; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Daily focus</p>
      <h1>오늘의 할 일</h1>
      <p class="date" id="today"></p>
    </header>

    <section class="card" aria-label="할 일 목록">
      <form class="input-wrap" id="todo-form">
        <input id="todo-input" type="text" maxlength="120" autocomplete="off" placeholder="새로운 할 일을 입력하세요" aria-label="새로운 할 일" />
        <button class="add-btn" type="submit">추가</button>
      </form>
      <div class="toolbar">
        <span class="count" id="count"></span>
        <button class="clear-btn" id="clear-completed" type="button">완료한 일 지우기</button>
      </div>
      <div class="empty" id="empty-state">
        <div class="empty-icon">✓</div>
        <div>아직 등록된 일이 없어요.<br />오늘의 첫 할 일을 추가해 보세요.</div>
      </div>
      <ul class="todo-list" id="todo-list"></ul>
    </section>
    <p class="footer">할 일은 이 기기에 자동으로 저장됩니다.</p>
  </main>

  <script>
    const STORAGE_KEY = 'today-todos-v1';
    const form = document.querySelector('#todo-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');
    const emptyState = document.querySelector('#empty-state');
    const count = document.querySelector('#count');
    const clearCompleted = document.querySelector('#clear-completed');

    let todos = loadTodos();

    function loadTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch { return []; }
    }

    function saveTodos() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

    function render() {
      list.replaceChildren();
      todos.forEach(todo => {
        const item = document.createElement('li');
        item.className = `todo-item${todo.done ? ' done' : ''}`;
        item.innerHTML = `
          <input class="check" type="checkbox" ${todo.done ? 'checked' : ''} aria-label="${escapeHtml(todo.text)} 완료 여부" />
          <span class="todo-text"></span>
          <button class="delete-btn" type="button" aria-label="할 일 삭제">×</button>`;
        item.querySelector('.todo-text').textContent = todo.text;
        item.querySelector('.check').addEventListener('change', event => {
          todo.done = event.target.checked;
          saveTodos(); render();
        });
        item.querySelector('.delete-btn').addEventListener('click', () => {
          todos = todos.filter(current => current.id !== todo.id);
          saveTodos(); render();
        });
        list.append(item);
      });
      const remaining = todos.filter(todo => !todo.done).length;
      count.innerHTML = `<strong>${remaining}</strong>개의 할 일이 남았어요`;
      emptyState.hidden = todos.length > 0;
      clearCompleted.hidden = !todos.some(todo => todo.done);
    }

    function escapeHtml(value) { return value.replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char])); }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      todos.unshift({ id: Date.now() + Math.random(), text, done: false });
      saveTodos(); render(); input.value = ''; input.focus();
    });

    clearCompleted.addEventListener('click', () => {
      todos = todos.filter(todo => !todo.done);
      saveTodos(); render();
    });

    document.querySelector('#today').textContent = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());
    render();
  </script>
</body>
</html>
